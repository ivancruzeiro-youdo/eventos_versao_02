events {
    worker_connections 1024;
}

http {
    client_max_body_size 130m;

    upstream web {
        server web:3000;
    }

    upstream api {
        server api:3001;
    }

    # HTTP server: redirect to HTTPS, but keep ACME challenge reachable
    server {
        listen 80;
        server_name eventos.youdobrasil.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server (production)
    server {
        listen 443 ssl;
        http2 on;
        server_name eventos.youdobrasil.com.br;

        ssl_certificate /etc/letsencrypt/live/eventos.youdobrasil.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eventos.youdobrasil.com.br/privkey.pem;

        # Frontend
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # API
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
