events {
    worker_connections 1024;
}

http {
    client_max_body_size 130m;

    upstream web {
        server web:3000;
    }

    upstream api {
        server api:3001;
    }

    # HTTP server: redirect to HTTPS, but keep ACME challenge reachable
    server {
        listen 80;
        server_name eventos.youdobrasil.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server (production)
    server {
        listen 443 ssl;
        http2 on;
        server_name eventos.youdobrasil.com.br;

        ssl_certificate /etc/letsencrypt/live/eventos.youdobrasil.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eventos.youdobrasil.com.br/privkey.pem;

        # Frontend
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Stream de mudanças da TELA COZINHA (SSE).
        # Precisa de bloco próprio: com o buffer do proxy ligado (padrão) os eventos ficam
        # presos e só saem em bloco, e o proxy_read_timeout padrão de 60s derruba a conexão
        # parada. Regex vence prefixo no nginx, então este bloco pega antes do /api/ abaixo.
        # A resposta também manda X-Accel-Buffering: no, então funciona mesmo se esta config
        # não for recarregada.
        location ~ ^/api/v2/kitchen/display/events/[^/]+/stream$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Connection vazio: SSE é keep-alive comum, não upgrade de protocolo.
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # API
        # proxy_read_timeout maior que o padrão de 60s: rotas que chamam a Userp pra tudo
        # (sync-preview varre todos os contratos + busca detalhe um por um; userp-status por
        # evento) já passaram de 60s conforme a base de contratos cresceu, e o nginx cortava a
        # conexão com 502 mesmo com a API ainda processando normalmente do outro lado.
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
